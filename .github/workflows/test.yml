name: Cloud Leecher Engine

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL of file to download"
        required: true
      folder_name:
        description: "Output folder name"
        required: true
      safe_mode:
        description: "Override file name (true/false)"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process File
        run: |
          sudo apt-get update && sudo apt-get install -y zip

          URL="${{ github.event.inputs.file_url }}"
          FOLDER="${{ github.event.inputs.folder_name }}"
          SAFE_MODE="${{ github.event.inputs.safe_mode }}"

          RAW_NAME=$(basename "${URL%%\?*}" | sed 's/%20/ /g')
          EXT="${RAW_NAME##*.}"

          if [ "$SAFE_MODE" == "true" ]; then
            FINAL_FILE="$FOLDER.$EXT"
          else
            NAME_NO_EXT="${RAW_NAME%.*}"
            FINAL_FILE="$NAME_NO_EXT.$EXT"
          fi

          curl -L --fail --retry 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --progress-bar \
            -o "temp_download" "$URL"

          mkdir -p wrap_dir
          mv "temp_download" "wrap_dir/$FINAL_FILE"
          cd wrap_dir
          zip -0 "../$FOLDER.zip" "$FINAL_FILE"
          cd ..

          mkdir -p "downloads/$FOLDER"
          split -b 90M -d -a 3 "$FOLDER.zip" "downloads/$FOLDER/chunk_"

          a=1
          for i in downloads/$FOLDER/chunk_*; do
            new=$(printf "downloads/$FOLDER/$FOLDER.zip.%03d" "$a")
            mv "$i" "$new"
            a=$((a+1))
          done

          FILES=(downloads/$FOLDER/$FOLDER.zip.*)
          TOTAL=${#FILES[@]}
          MID=$((TOTAL / 2))

          echo "Total chunks: $TOTAL"
          echo "Midpoint index: $MID"

          git config user.name "OctoFetchBot"
          git config user.email "bot@octofetch.local"

          git pull origin main || true

          echo "---- PUSHING FIRST HALF ----"
          for ((i=0; i<MID; i++)); do
            git add "${FILES[$i]}"
          done

          git commit -m "Add $FOLDER (Part 1/2)" || echo "Nothing to commit"
          git push || echo "Push 1 failed but continuing"

          sleep 5

          echo "---- PUSHING SECOND HALF ----"
          for ((i=MID; i<TOTAL; i++)); do
            git add "${FILES[$i]}"
          done

          git commit -m "Add $FOLDER (Part 2/2)" || echo "Nothing to commit"
          git push || echo "Push 2 failed"
